# Boletim do Rafael em 2025 (ano e trimestre em segmentos): abre no 1º
# trimestre, com o resumo (média 8,2, 14 faltas) e Língua Portuguesa com
# 9,5 e 0 faltas; o 2º trimestre ainda não foi avaliado.
appId: br.com.fiap.school
name: 05 - Boletim de 2025
tags:
  - boletim
---
- runFlow: subflows/launch-clean.yaml
- runFlow:
    file: subflows/login.yaml
    env:
      CPF: '96929456004'
      PASSWORD: '123456'
- extendedWaitUntil:
    visible:
      id: agenda-screen
    timeout: 10000
- runFlow:
    file: subflows/select-student.yaml
    env:
      RM: '12567'
- tapOn:
    id: tab-boletim
- extendedWaitUntil:
    visible:
      id: boletim-year-2025
      text: '.*2025 · 7EF'
      selected: true
    timeout: 10000

# Abre no último trimestre avaliado (DV5): o 1º.
- assertVisible:
    id: boletim-term-tab-1
    selected: true
# Resumo e cards são um elemento só para o leitor de tela: no iOS os textos
# de dentro não aparecem na hierarquia, então a conferência é pelo rótulo.
- assertVisible:
    id: boletim-summary
    text: '(?s).*Média 8,2, Bom\. 14 faltas em 12 disciplinas\. 1 abaixo de 7\..*'
- assertVisible:
    id: boletim-term-1-subject-0
    text: '(?s)Língua Portuguesa\. Nota 9,5, Bom\. 0 faltas\..*'
# No Android os textos de dentro também aparecem na hierarquia.
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: boletim-summary-average
          text: '8,2'
      - assertVisible:
          id: boletim-term-1-subject-0-grade
          text: '9,5'
      - assertVisible:
          id: boletim-term-1-subject-0-absences
          text: '0 faltas'

# Arte (6,5) é a única abaixo de 7: faixa "Atenção".
- scrollUntilVisible:
    element:
      id: boletim-term-1-subject-8
    direction: DOWN
- assertVisible:
    id: boletim-term-1-subject-8
    text: '(?s)Arte\. Nota 6,5, Atenção\. 2 faltas\..*'

# 2º trimestre ainda não avaliado.
- scrollUntilVisible:
    element:
      id: boletim-term-tab-2
    direction: UP
- tapOn:
    id: boletim-term-tab-2
- extendedWaitUntil:
    visible:
      id: boletim-term-2-not-evaluated
    timeout: 5000
- assertVisible:
    text: 'Ainda não avaliado'
- assertNotVisible:
    id: boletim-summary
