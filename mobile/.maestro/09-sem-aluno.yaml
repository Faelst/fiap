# Carlos (sem aluno vinculado; extra do seed): header só com a saudação e
# "Sua conta", o estado vazio, sem abas e sem chip; Sair sai na hora.
appId: br.com.fiap.school
name: 09 - Responsável sem aluno vê o estado vazio
tags:
  - alunos
---
- runFlow: subflows/launch-clean.yaml
- runFlow:
    file: subflows/login.yaml
    env:
      CPF: '31415926590'
      PASSWORD: '111111'
- extendedWaitUntil:
    visible:
      id: no-student-screen
    timeout: 10000
- assertVisible:
    id: no-student-empty
- assertVisible:
    text: 'Nenhum aluno vinculado'
- assertVisible:
    id: header-greeting
    text: '(?i)olá, carlos'
- assertVisible:
    id: no-student-title
    text: 'Sua conta'
- assertNotVisible:
    id: header-student-chip
- assertNotVisible:
    id: tab-bar
# Sair é a única saída daqui: sem confirmação (DV7).
- tapOn:
    id: no-student-logout-button
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 5000
