# Gustavo (2 alunos): do Boletim, o chip do aluno no header leva ao Perfil;
# a troca é feita lá e, de volta ao Boletim, o boletim e o chip já são do
# aluno novo. Escolhe o aluno inicial explicitamente, sem depender do /me.
appId: br.com.fiap.school
name: 07 - Chip do header leva ao Perfil e a troca atualiza o Boletim
tags:
  - alunos
---
- runFlow: subflows/launch-clean.yaml
- runFlow:
    file: subflows/login.yaml
    env:
      CPF: '96929456004'
      PASSWORD: '123456'
- extendedWaitUntil:
    visible:
      id: agenda-screen
    timeout: 10000

# Rafael (7EF).
- runFlow:
    file: subflows/select-student.yaml
    env:
      RM: '12567'
- tapOn:
    id: tab-boletim
- extendedWaitUntil:
    visible:
      id: boletim-year-dropdown
      text: '.*7EF - 2025'
    timeout: 10000
- assertVisible:
    id: header-student-chip
    text: '(?i)aluno rafael,.*'

# O chip leva ao Perfil (V7); lá, Joana (2EM).
- tapOn:
    id: header-student-chip
- extendedWaitUntil:
    visible:
      id: profile-screen
    timeout: 5000
- tapOn:
    id: profile-student-12568
- extendedWaitUntil:
    visible:
      id: profile-student-12568
      selected: true
    timeout: 5000

# De volta ao Boletim, com o boletim e o chip dela.
- tapOn:
    id: tab-boletim
- extendedWaitUntil:
    visible:
      id: boletim-year-dropdown
      text: '.*2EM - 2025'
    timeout: 10000
- assertVisible:
    id: header-student-chip
    text: '(?i)aluno joana,.*'
- assertNotVisible:
    id: agenda-week-strip
