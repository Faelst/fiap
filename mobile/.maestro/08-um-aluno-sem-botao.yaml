# Adelaide (1 aluna, Bianca): sem TROCAR PERFIL nas abas e, no Perfil, a
# Bianca como atual e sem a dica de troca.
appId: br.com.fiap.school
name: 08 - Responsável com 1 aluno não vê TROCAR PERFIL
tags:
  - alunos
---
- runFlow: subflows/launch-clean.yaml
- runFlow:
    file: subflows/login.yaml
    env:
      CPF: '50879567007'
      PASSWORD: '987654'
- extendedWaitUntil:
    visible:
      id: agenda-screen
    timeout: 10000
- assertVisible:
    id: header-greeting
    text: '(?i)olá, adelaide'
- assertVisible:
    text: '(?i)aluno bianca,.*'
- assertVisible:
    id: header-logout-button
- assertNotVisible:
    id: header-switch-student-button
- tapOn:
    id: tab-perfil
- extendedWaitUntil:
    visible:
      id: profile-student-13752
      selected: true
    timeout: 5000
- assertNotVisible:
    id: profile-students-hint
- tapOn:
    id: tab-boletim
- extendedWaitUntil:
    visible:
      id: boletim-year-dropdown
      text: '.*1EF - 2025'
    timeout: 10000
- assertNotVisible:
    id: header-switch-student-button
