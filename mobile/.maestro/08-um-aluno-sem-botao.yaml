# Adelaide (1 aluna, Bianca): o chip do header mostra a Bianca e, no Perfil,
# ela é a atual, sem a dica de troca.
appId: br.com.fiap.school
name: 08 - Responsável com 1 aluno vê a aluna como atual, sem troca
tags:
  - alunos
---
- runFlow: subflows/launch-clean.yaml
- runFlow:
    file: subflows/login.yaml
    env:
      CPF: '50879567007'
      PASSWORD: '987654'
- extendedWaitUntil:
    visible:
      id: agenda-screen
    timeout: 10000
- assertVisible:
    id: header-greeting
    text: '(?i)olá, adelaide'
- assertVisible:
    id: header-student-chip
    text: '(?i)aluno bianca,.*'
- tapOn:
    id: tab-perfil
- extendedWaitUntil:
    visible:
      id: profile-student-13752
      selected: true
    timeout: 5000
- assertNotVisible:
    id: profile-students-hint
- tapOn:
    id: tab-boletim
- extendedWaitUntil:
    visible:
      id: boletim-year-2025
      text: 'Ano letivo 2025 · 1EF'
    timeout: 10000
