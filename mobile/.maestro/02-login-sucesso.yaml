# Login do Gustavo (2 alunos): abre a Agenda com o header compacto (saudação,
# título e chip do aluno) e a tab bar flutuante com as 3 abas.
appId: br.com.fiap.school
name: 02 - Login com sucesso abre a Agenda
tags:
  - login
---
- runFlow: subflows/launch-clean.yaml
- runFlow:
    file: subflows/login.yaml
    env:
      CPF: '96929456004'
      PASSWORD: '123456'
- extendedWaitUntil:
    visible:
      id: agenda-screen
    timeout: 10000
- assertVisible:
    id: header-greeting
    text: '(?i)olá, gustavo'
# O aluno inicial vem do /me; qualquer um dos dois serve aqui. TROCAR PERFIL
# e SAIR saíram do header: ficam na aba Perfil (V7).
- assertVisible:
    id: header-student-chip
    text: '(?i)aluno (rafael|joana),.*'
- assertVisible:
    id: agenda-title
    text: 'Agenda'
- extendedWaitUntil:
    visible:
      id: agenda-week-strip
    timeout: 10000
- assertVisible:
    id: tab-agenda
- assertVisible:
    id: tab-boletim
- assertVisible:
    id: tab-perfil
