# Bônus: o segmento de ano troca para o boletim de 2024 do Rafael
# ("2024 · 6EF"), que abre no 3º trimestre (o último avaliado).
appId: br.com.fiap.school
name: 06 - Boletim de anos anteriores
tags:
  - boletim
---
- runFlow: subflows/launch-clean.yaml
- runFlow:
    file: subflows/login.yaml
    env:
      CPF: '96929456004'
      PASSWORD: '123456'
- extendedWaitUntil:
    visible:
      id: agenda-screen
    timeout: 10000
- runFlow:
    file: subflows/select-student.yaml
    env:
      RM: '12567'
- tapOn:
    id: tab-boletim
- extendedWaitUntil:
    visible:
      id: boletim-year-2025
      text: '.*2025 · 7EF'
    timeout: 10000
- tapOn:
    id: boletim-year-2024
- extendedWaitUntil:
    visible:
      id: boletim-year-2024
      selected: true
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: boletim-term-tab-3
      selected: true
    timeout: 10000

# 2024, 1º trimestre > Língua Portuguesa: nota 8,0 e 1 falta.
- tapOn:
    id: boletim-term-tab-1
- extendedWaitUntil:
    visible:
      id: boletim-term-1-subject-0
      text: '(?s).*Nota 8,0.*1 falta\..*'
    timeout: 5000
