# SAIR volta ao Login; fechar e abrir o app continua no Login.
appId: br.com.fiap.school
name: 10 - Logout
tags:
  - login
---
- runFlow: subflows/launch-clean.yaml
- runFlow:
    file: subflows/login.yaml
    env:
      CPF: '96929456004'
      PASSWORD: '123456'
- extendedWaitUntil:
    visible:
      id: agenda-screen
    timeout: 20000
- runFlow: subflows/logout.yaml
- assertNotVisible:
    id: agenda-screen
- stopApp
- launchApp
- runFlow: subflows/dismiss-system-anr.yaml
# Abertura a frio + splash: até 30 s, como no subflows/launch-clean.yaml.
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 30000
- assertNotVisible:
    id: agenda-screen
