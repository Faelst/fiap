# Sessão salva no keychain: fechar e abrir o app volta direto para a Agenda.
appId: br.com.fiap.school
name: 03 - Sessão persistida ao reabrir o app
tags:
  - login
---
- runFlow: subflows/launch-clean.yaml
- runFlow:
    file: subflows/login.yaml
    env:
      CPF: '96929456004'
      PASSWORD: '123456'
- extendedWaitUntil:
    visible:
      id: agenda-screen
    timeout: 20000
- stopApp
# Sem clearState: a sessão tem de sobreviver ao relançamento.
- launchApp
- runFlow: subflows/dismiss-system-anr.yaml
# Abertura a frio + splash (o /me tem 8 s de timeout): até 30 s, como no
# subflows/launch-clean.yaml.
- extendedWaitUntil:
    visible:
      id: agenda-screen
    timeout: 30000
- assertNotVisible:
    id: login-screen
